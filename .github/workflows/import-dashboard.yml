name: Import dashboard snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import full dashboard HTML
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/ycssup/ycssup/main/index.html \
            -o index.html
          test -s index.html

      - name: Commit imported dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Dashboard is already up to date."
            exit 0
          fi
          git commit -m "Import full dashboard HTML"
          git push
