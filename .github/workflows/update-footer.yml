name: Update dashboard footer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-footer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update footer text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<footer class="footer"><div><strong>v18 · Daily refresh · 14 Sep 2026</strong> · Institutional Research · Built for class presentation, not trading execution.</div>'
          new = '<footer class="footer"><div><strong>Daily refresh · 14 Sep 2026</strong></div>'
          if old not in s:
              raise SystemExit('Target footer text not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify dashboard footer"
          git pull --rebase origin main
          git push
