<!doctype html><meta charset="utf-8"><title>Morning Meeting Dashboard</title><script>(async()=>{const src=await (await fetch('https://raw.githubusercontent.com/ycssup/daily-market-dashboard/0d3ccd9f931fb76943ade1e33810705fbb8199c8/index.html')).text();const m=src.match(/const b='([^']+)'/);if(!m)throw new Error('Dashboard payload not found');const u=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');let txt=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();txt=txt.replace('<div class="date">Market data through 14 Sep 2026 · news/event monitor updated 14 Sep 2026</div>','<div class="date">Morning Meeting · 15 Sep 2026<br><span style="font-size:9px;font-weight:600;color:#657487">Market data through 14 Sep 2026 · News/event monitor updated 15 Sep 2026</span></div>');document.open();document.write(txt);document.close()})();</script>
