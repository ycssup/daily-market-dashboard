<!doctype html><meta charset="utf-8"><title>Morning Meeting Dashboard</title><script>(async()=>{const src=await (await fetch('https://raw.githubusercontent.com/ycssup/daily-market-dashboard/5194d1a093325465f8af087c54526fbf37f85ccc/index.html.html')).text();const m=src.match(/const b='([^']+)'/);if(!m)throw new Error('Dashboard payload not found');const u=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const txt=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(txt);document.close()})();</script>
