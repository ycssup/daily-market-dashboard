<!doctype html><meta charset="utf-8"><title>Morning Meeting Dashboard</title><script>(async()=>{const src=await (await fetch('https://raw.githubusercontent.com/ycssup/daily-market-dashboard/0d3ccd9f931fb76943ade1e33810705fbb8199c8/index.html')).text();const m=src.match(/const b='([^']+)'/);if(!m)throw new Error('Dashboard payload not found');const u=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const txt=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();const doc=new DOMParser().parseFromString(txt,'text/html');const asof=doc.querySelector('.asof .date');if(asof)asof.innerHTML='Morning Meeting · 15 Sep 2026<br><span style="font-size:9px;font-weight:600;color:#657487">Market data through 14 Sep 2026 · News/event monitor updated 15 Sep 2026</span>';const style=doc.querySelector('style');if(style)style.textContent+='\n.level-chart{height:165px!important}.level-chart .xtick{font-size:4.7px!important;fill:#748394}.level-chart .xtickmark{stroke:#8b96a2;stroke-width:.65;vector-effect:non-scaling-stroke}\n';const NS='http://www.w3.org/2000/svg';const start=new Date(Date.UTC(2026,7,12));const end=new Date(Date.UTC(2026,8,14));const nDays=Math.round((end-start)/86400000);const fmt=d=>d.getUTCDate()+' '+d.toLocaleString('en-US',{month:'short',timeZone:'UTC'});doc.querySelectorAll('.actual-charts').forEach(group=>{const svgs=group.querySelectorAll('svg.level-chart');svgs.forEach((svg,i)=>{svg.setAttribute('viewBox','0 0 720 165');svg.querySelectorAll('.xtick,.xtickmark').forEach(e=>e.remove());if(i!==svgs.length-1)return;for(let k=0;k<=nDays;k++){const d=new Date(start.getTime()+k*86400000);const x=58+(635-58)*k/nDays;const tick=doc.createElementNS(NS,'line');tick.setAttribute('class','xtickmark');tick.setAttribute('x1',x.toFixed(1));tick.setAttribute('x2',x.toFixed(1));tick.setAttribute('y1','116');tick.setAttribute('y2','119.5');svg.appendChild(tick);const t=doc.createElementNS(NS,'text');t.setAttribute('class','xtick');t.setAttribute('text-anchor','end');t.setAttribute('x',(x+1.2).toFixed(1));t.setAttribute('y','134');t.setAttribute('transform',`rotate(-60 ${(x+1.2).toFixed(1)} 134)`);t.textContent=fmt(d);svg.appendChild(t)}});const note=group.querySelector('.chart-note');if(note)note.textContent='Each benchmark has its own y-axis and shares the same calendar-date axis. Every date in the displayed period is shown; weekends and market holidays may have no new observation. The latest value label remains in a dedicated gutter to the right of the plotting area.'});document.open();document.write('<!DOCTYPE html>'+doc.documentElement.outerHTML);document.close()})();</script>
